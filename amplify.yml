# Amplify Hosting monorepo build spec. The frontend lives in ui/, not the
# repo root, so this uses the "applications" monorepo format with
# appRoot: ui. See docs/BLUEPRINT.md §12.12.
version: 1
applications:
  - appRoot: ui
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
